[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nml-shelf-intelligence"
version = "0.1.0"
description = "NML Shelf Intelligence — online-to-offline product recommendation system for KSA retail"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orbit*", "shared*", "genome*", "sentinel*", "ledger*", "atlas*", "oracle*", "prism*", "pulse*"]

[tool.ruff]
line-length = 100
target-version = "py312"
