version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nml_shelf
      POSTGRES_USER: nml
      POSTGRES_PASSWORD: nml_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nml -d nml_shelf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
